name: probe-jp8

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取
        run: python /home/runner/work/skyscrips/skyscrips/.github/scripts/probe_jp8.py 2>&1 | tee /tmp/jp8_log.txt

      - name: 打包
        if: always()
        run: |
          cp /tmp/jp8_log.txt out_jp8/log_main.txt 2>/dev/null || true
          zip -r -0 jp8_out.zip out_jp8 2>/dev/null || true
          ls -la jp8_out.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jp8-out
          path: jp8_out.zip
          if-no-files-found: warn
