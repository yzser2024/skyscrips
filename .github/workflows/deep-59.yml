name: deep-59
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep59_kisui79.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep59
          path: out_deep59
          if-no-files-found: warn
