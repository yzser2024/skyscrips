name: probe-allnames3

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取
        run: python /home/runner/work/skyscrips/skyscrips/.github/scripts/probe_allnames3.py 2>&1 | tee /tmp/a3_log.txt

      - name: 打包
        if: always()
        run: |
          cp /tmp/a3_log.txt out_a3/log_main.txt 2>/dev/null || true
          zip -r -0 a3_out.zip out_a3 2>/dev/null || true
          ls -la a3_out.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3-out
          path: a3_out.zip
          if-no-files-found: warn
