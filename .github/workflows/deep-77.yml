name: deep-77
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 .github/scripts/deep77_audio_all.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep77
          path: out_deep77
          if-no-files-found: warn
