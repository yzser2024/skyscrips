name: deep-6

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FC2与母站缺口普查
        run: python deep6_gap.py 2>&1 | tee deep_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-6
          path: |
            out_deep6/
            deep_log.txt
          retention-days: 20
