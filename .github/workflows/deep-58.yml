name: deep-58
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep58_oldmenu.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep58
          path: out_deep58
          if-no-files-found: warn
