name: deep-51
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep51_rest.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep51
          path: out_deep51
          if-no-files-found: warn
