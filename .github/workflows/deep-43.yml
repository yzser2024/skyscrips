name: deep-43
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep43_jina.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep43
          path: out_deep43
          if-no-files-found: warn
