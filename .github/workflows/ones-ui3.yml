name: ones-ui3

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 按清单补图
        run: python ones_ui_fetch3.py 2>&1 | tee ui3_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ones-ui3
          path: |
            out_ui/
            ui3_log.txt
          retention-days: 14
