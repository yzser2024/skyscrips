name: deep-45
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep45_unseen.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep45
          path: out_deep45
          if-no-files-found: warn
