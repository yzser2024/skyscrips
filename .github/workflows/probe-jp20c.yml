name: probe-jp20c

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 装 yt-dlp 与 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp
      - name: 按 URL 列表逐首下载 31 首
        run: |
          mkdir -p out_jp20c/mp3
          yt-dlp -a .github/scripts/jp20_urls.txt \
            -f bestaudio --extract-audio --audio-format mp3 --audio-quality 0 \
            --write-info-json --embed-metadata --no-overwrites \
            --sleep-requests 1 --retries 6 --fragment-retries 6 --ignore-errors \
            -o "out_jp20c/mp3/%(autonumber)03d_%(id)s_%(title).70s.%(ext)s" \
            2>&1 | tee out_jp20c/log_jp20c.txt || true
          echo "count:" $(ls out_jp20c/mp3/*.mp3 2>/dev/null | wc -l)
      - name: 按 6 首一组拆成独立目录
        if: always()
        run: |
          python3 - <<'PY'
          import glob,os,shutil
          fs=sorted(glob.glob('out_jp20c/mp3/*.mp3'))
          print('mp3',len(fs))
          for i in range(0,len(fs),6):
              g='out_jp20c/g%d'%(i//6+1)
              os.makedirs(g,exist_ok=True)
              for f in fs[i:i+6]: shutil.copy2(f,g)
              print(g,len(fs[i:i+6]))
          PY
          ls out_jp20c/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp20c-g1, path: out_jp20c/g1/*.mp3, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp20c-g2, path: out_jp20c/g2/*.mp3, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp20c-g3, path: out_jp20c/g3/*.mp3, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp20c-g4, path: out_jp20c/g4/*.mp3, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp20c-g5, path: out_jp20c/g5/*.mp3, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp20c-g6, path: out_jp20c/g6/*.mp3, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp20c-log, path: out_jp20c/log_jp20c.txt, if-no-files-found: warn, compression-level: 0 }
