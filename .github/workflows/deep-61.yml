name: deep-61
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep61_clap.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep61
          path: out_deep61
          if-no-files-found: warn
