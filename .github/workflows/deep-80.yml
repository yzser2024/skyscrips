name: deep-80
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 .github/scripts/deep80_tumblr.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep80
          path: out_deep80
          if-no-files-found: warn
