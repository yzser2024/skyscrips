name: deep-72
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 .github/scripts/deep72_fetch_ld.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep72
          path: out_deep72
          if-no-files-found: warn
