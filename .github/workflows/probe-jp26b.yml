name: probe-jp26b

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: 装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp requests
      - name: 方案 A：yt-dlp 换 player_client
        run: |
          mkdir -p out_jp26b
          yt-dlp "https://www.youtube.com/watch?v=mXQl-mcWzhU" \
            --extractor-args "youtube:player_client=tv,web_safari,android_vr,ios,mweb" \
            --js-runtimes deno \
            -f bestaudio --extract-audio --audio-format mp3 --audio-quality 0 \
            --embed-metadata --no-overwrites \
            -o "out_jp26b/crystal_pool_A.%(ext)s" 2>&1 | tee out_jp26b/logA.txt || true
          ls -lh out_jp26b
      - name: 方案 B：Invidious / Piped 公共实例直链
        if: always()
        run: |
          python - <<'PY' 2>&1 | tee out_jp26b/logB.txt
          import requests, json, os
          vid = 'mXQl-mcWzhU'
          apis = [
              'https://yewtu.be/api/v1/videos/' + vid,
              'https://inv.nadeko.net/api/v1/videos/' + vid,
              'https://invidious.nerdvpn.de/api/v1/videos/' + vid,
              'https://pipedapi.kavin.rocks/streams/' + vid,
              'https://pipedapi.adminforge.de/streams/' + vid,
          ]
          urls = []
          for u in apis:
              try:
                  r = requests.get(u, timeout=20, headers={'User-Agent': 'Mozilla/5.0'})
                  print(u, r.status_code, len(r.content))
                  if r.status_code != 200: continue
                  d = r.json()
                  items = d.get('adaptiveFormats') or d.get('audioStreams') or []
                  for it in items:
                      if it.get('type', '').startswith('audio') or it.get('mimeType', '').startswith('audio'):
                          au = it.get('url') or it.get('src')
                          if au: urls.append((u, au, it.get('qualityLabel') or it.get('quality') or '', it.get('mimeType') or it.get('type')))
              except Exception as e:
                  print(u, 'ERR', type(e).__name__, str(e)[:80])
          print('AUDIO URLS', len(urls))
          os.makedirs('out_jp26b', exist_ok=True)
          json.dump(urls, open('out_jp26b/audio_urls.json', 'w'), indent=1)
          for i, (src, au, q, mime) in enumerate(urls[:3]):
              try:
                  rr = requests.get(au, timeout=120, headers={'User-Agent': 'Mozilla/5.0'})
                  print('download', i, rr.status_code, len(rr.content))
                  if rr.status_code == 200 and len(rr.content) > 50000:
                      open('out_jp26b/crystal_pool_B%d.raw' % i, 'wb').write(rr.content)
              except Exception as e:
                  print('download ERR', type(e).__name__, str(e)[:80])
          PY
      - name: 转 mp3
        if: always()
        run: |
          for f in out_jp26b/crystal_pool_B*.raw; do
            [ -e "$f" ] || continue
            ffmpeg -y -i "$f" -codec:a libmp3lame -q:a 0 "out_jp26b/crystal_pool_B.mp3" 2>&1 | tail -3 && break
          done
          ls -lh out_jp26b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jp26b-out
          path: out_jp26b/*
          if-no-files-found: warn
          compression-level: 0
