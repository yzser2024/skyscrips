name: deep-63
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 .github/scripts/deep63_ldcc.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep63
          path: out_deep63
          if-no-files-found: warn
