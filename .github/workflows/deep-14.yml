name: deep-14

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 不折叠的完整CDX
        run: python deep14_full_cdx.py 2>&1 | tee deep_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-14
          path: |
            out_deep14/
            deep_log.txt
          retention-days: 20
