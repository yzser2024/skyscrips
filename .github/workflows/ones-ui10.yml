name: ones-ui10

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 补抓 BBS 皮肤
        run: python ones_ui_fetch10.py 2>&1 | tee ui10_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ones-ui10
          path: |
            out_ui/
            ui10_log.txt
          retention-days: 14
