name: Build app.asar only (win81 port)

# Produces app.asar (+ app.asar.unpacked) for the Win7-patched Electron 44.2.0
# already installed on the target machine. The upstream `package:desktop:*`
# pipeline downloads Electron 44.7.0 and bundles it into an installer, which is
# what makes its output unable to start on Windows 8.1. Here we run only the
# preparation half of that pipeline, then hand-pack the asar ourselves.
#
# Preparation order mirrors apps/desktop/scripts/package-target.ts (518-561):
#   pack()            -> packed/{dsh,vendor,landlock}
#   prepare:runtime   -> electron host (used as the Node binary) + primary runtime
#   prepare:packages  -> reads packed/*, emits package-set/
#   prepare:dsh       -> materialises targets/win-x64/dsh/
#
# asar layout mirrors electron-builder-config.mjs `files` (157-173):
#   lib/main.js, lib/operation-report-worker.js, lib/welcome/**,
#   lib/preload-*.cjs, renderer/**, package.json, dsh/**, dsh/node_modules/**
# and `asarUnpack` (82-87) applied via --unpack on the same globs.

on:
  workflow_dispatch:

jobs:
  build-asar:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      DSH_DESKTOP_TARGET_PLATFORM: win32
      DSH_DESKTOP_TARGET_ARCH: x64
      # Selector, not the recorded value: scripts/build.ts:181 reads
      # DSH_BUILD_CLIENT_PROFILE to pick a profile, and 'local' makes the record
      # contain exactly { DSH_CLIENT_BUILD_PROFILE: 'local', COMMIT_HASH, VERSION }
      # which pack-local-packages.ts asserts against. Do not add DSH_CLIENT_TITLE.
      DSH_BUILD_CLIENT_PROFILE: local
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: dshu-win81-build
          fetch-depth: 1

      - name: Ensure git commit for build version
        shell: bash
        run: |
          git config user.email build@local
          git config user.name Build
          if [ -z "$(git rev-parse HEAD 2>/dev/null)" ]; then
            git add -A
            git commit -m "baseline"
          fi
          git rev-parse HEAD

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Setup pnpm 11.28.5 via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Generate and verify tsconfig paths
        shell: bash
        run: |
          pnpm run gen-tsconfig-paths
          pnpm run verify-tsconfig-paths

      - name: Build
        shell: bash
        run: pnpm run build

      # ASCII-only, no heredoc indentation: desktop-file-settings.mjs parses the
      # file verbatim and rejects keys that are not in the shared allowlist.
      - name: Create .env.windows
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'DSH_DESKTOP_APP_ID=com.deepseek.dsh.uncensored' \
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://policy.invalid' \
            'DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={}' \
            > apps/desktop/.env.windows
          if LC_ALL=C grep -qP '[^\x20-\x7e]' apps/desktop/.env.windows; then
            echo "::error::non-ASCII byte in .env.windows"; exit 1
          fi
          cat apps/desktop/.env.windows

      # pack() from package-target.ts. pnpm resolves --pack-destination relative
      # to the package directory, so every destination must be absolute.
      - name: Pack local packages (dsh / vendor / landlock)
        shell: bash
        run: |
          set -euo pipefail
          PACKED="apps/desktop/.desktop-build/targets/win-x64/packed"
          ABS_DSH="$PWD/$PACKED/dsh"
          ABS_VENDOR="$PWD/$PACKED/vendor"
          ABS_LANDLOCK="$PWD/$PACKED/landlock"
          mkdir -p "$ABS_DSH" "$ABS_VENDOR" "$ABS_LANDLOCK"

          echo "--- pack-local-packages -> packed/dsh"
          pnpm exec tsx apps/desktop/scripts/pack-local-packages.ts --out "$ABS_DSH"

          echo "--- desktop-host pack -> packed/dsh"
          pnpm --dir apps/desktop-host pack --pack-destination "$ABS_DSH"

          echo "--- release:pack vendor -> packed/vendor"
          pnpm run release:pack --family vendor --out "$ABS_VENDOR"

          echo "--- native/system entry pack -> packed/landlock"
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$ABS_LANDLOCK"

          echo "=== packed contents ==="
          for d in dsh vendor landlock; do echo "  [$d] $(ls -1 "$PACKED/$d" | wc -l) files"; done
          echo "=== required tarballs ==="
          ls -1 "$ABS_DSH" | grep -i 'dsh-desktop-host' || { echo "::error::desktop-host tarball missing"; exit 1; }
          ls -1 "$ABS_LANDLOCK" | grep -i 'node-addon-system' || { echo "::error::node-addon-system tarball missing"; exit 1; }

      # prepare.ts uses bare Node fetch (no proxy support) and pulls
      # python-build-standalone from a GitHub Release, so retry transient failures.
      - name: Prepare runtime (electron host + primary runtime)
        shell: bash
        run: |
          set -uo pipefail
          export DSH_RESOURCE_DOWNLOAD_TIMEOUT_MS=600000
          for attempt in 1 2 3; do
            LOG="prepare-runtime-$attempt.log"
            echo "=== prepare:runtime attempt $attempt ==="
            if pnpm exec tsx apps/desktop/scripts/prepare-runtime.ts --defer-primary-runtime-smoke >"$LOG" 2>&1; then
              cp "$LOG" prepare-runtime.log
              tail -30 "$LOG"
              exit 0
            fi
            echo "=== attempt $attempt FAILED — full log ==="
            cat "$LOG"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::prepare:runtime failed after 3 attempts"
          exit 1

      # selectDesktopPackageClosure only recurses into optional deps that are
      # present (prepare-package-set.ts:92-96), so a win32 payload omits the
      # landlock launcher (its optionalDependencies are darwin/linux only).
      - name: Prepare package set
        shell: bash
        run: |
          set -euo pipefail
          PACKED_DIR="$PWD/apps/desktop/.desktop-build/targets/win-x64/packed"
          pnpm exec tsx apps/desktop/scripts/prepare-package-set.ts \
            --from "$PACKED_DIR/dsh" \
            --from "$PACKED_DIR/vendor" 2>&1 | tee prepare-packages.log
          cat prepare-packages.log

      - name: Prepare dsh closure
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx apps/desktop/scripts/prepare-dsh.ts --defer-runtime-smoke 2>&1 | tee prepare-dsh.log

      - name: Inspect prepared tree
        shell: bash
        run: |
          echo "=== targets/win-x64 ==="
          ls -la apps/desktop/.desktop-build/targets/win-x64/ || true
          echo "=== dsh/ ==="
          ls -la apps/desktop/.desktop-build/targets/win-x64/dsh/ || true
          du -sh apps/desktop/.desktop-build/targets/win-x64/dsh/ || true

      # Mirrors electron-builder-config.mjs files[] (157-173). lib/welcome/** is
      # mandatory: main.ts:861 serves design-platform.css from app.asar/lib/welcome.
      - name: Assemble asar root
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          DSH_DIR=".desktop-build/targets/win-x64/dsh"
          test -f "$DSH_DIR/package.json" || { echo "::error::dsh/package.json missing"; exit 1; }
          test -f lib/welcome/design-platform.css || { echo "::error::lib/welcome/design-platform.css missing"; exit 1; }

          ROOT="$PWD/.asar-root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/lib/welcome" "$ROOT/dsh"

          cp lib/main.js lib/operation-report-worker.js "$ROOT/lib/"
          cp lib/preload-app.cjs lib/preload-mandatory.cjs lib/preload-platform-account.cjs \
             lib/preload-update-dialog.cjs lib/preload-welcome.cjs "$ROOT/lib/"
          cp -r lib/welcome/. "$ROOT/lib/welcome/"
          cp -r renderer "$ROOT/renderer"
          cp package.json "$ROOT/package.json"
          (cd "$DSH_DIR" && tar cf - .) | (cd "$ROOT/dsh" && tar xf -)

          # electron-builder strips sourcemaps from node_modules; keep the same.
          find "$ROOT/dsh" -type f \( -name '*.js.map' -o -name '*.cjs.map' -o -name '*.mjs.map' -o -name '*.tsbuildinfo' \) -delete || true
          echo "=== layout ==="
          ls -la "$ROOT"
          du -sh "$ROOT"

      # Mirrors electron-builder-config.mjs extraMetadata (123-132), all fields.
      - name: Merge extraMetadata into package.json
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          node -e '
            const fs = require("node:fs");
            const p = ".asar-root/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const base = j.version;
            const m = /^(\d{4})\.(\d{4})\.(\d+)$/.exec(base);
            const display = m ? `${m[1]}.${m[2].slice(0,2)}.${m[2].slice(2)}.${m[3]}` : base;
            Object.assign(j, {
              name: "deepseek-harness-uncensored",
              dshDesktopAppId: "com.deepseek.dsh.uncensored",
              dshUncensored: JSON.parse(fs.readFileSync("../../product.json", "utf8")),
              dshDisplayVersion: display,
              dshDesktopUpdateChannel: "latest",
            });
            if (m) j.shortVersionWindows = display;
            fs.writeFileSync(p, JSON.stringify(j, undefined, 2));
            console.log("metadata:", j.name, j.version, j.dshDisplayVersion, j.dshDesktopUpdateChannel, j.shortVersionWindows);
          '

      # Collect the PE files that must live OUTSIDE the asar. Upstream enforces
      # this in windows-asar-unpack.mjs:61 (entry.unpacked !== true throws) and
      # additionally compares bytes, so the unpack list is not optional.
      - name: Compute PE unpack list
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          DSH_DIR=".desktop-build/targets/win-x64/dsh"
          : > pe-list.txt
          # Native payloads electron-builder always unpacks (electron-builder-config.mjs:82-87)
          find "$DSH_DIR" -type f \( \
              -name '*.node' -o -name '*.dll' -o -name '*.exe' -o -name '*.so' -o -name '*.dylib' -o -name '*.so.*' \
            \) | sed "s|^$DSH_DIR/||" >> pe-list.txt
          find "$DSH_DIR/node_modules/@vscode" -type d -name 'ripgrep-*' -exec find {} -type f -path '*/bin/rg*' \; 2>/dev/null \
            | sed "s|^$DSH_DIR/||" >> pe-list.txt
          sort -u pe-list.txt -o pe-list.txt
          echo "PE files to unpack: $(wc -l < pe-list.txt)"
          head -20 pe-list.txt

      - name: Pack app.asar with unpacked PE
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          ARGS=()
          while IFS= read -r f; do
            [ -n "$f" ] && ARGS+=("--unpack" "dsh/$f")
          done < pe-list.txt
          echo "asar args: ${#ARGS[@]} entries"
          npx --yes @electron/asar pack .asar-root app.asar "${ARGS[@]}"
          ls -la app.asar
          wc -c < app.asar
          test -d app.asar.unpacked || { echo "::error::app.asar.unpacked not produced"; exit 1; }
          echo "=== unpacked PE count ==="
          find app.asar.unpacked -type f | wc -l
          echo "=== top entries ==="
          npx --yes @electron/asar list app.asar | awk -F/ 'NF==2' | head -20

      - name: Upload asar
        uses: actions/upload-artifact@v4
        with:
          name: dshu-app-asar
          path: |
            apps/desktop/app.asar
            apps/desktop/app.asar.unpacked/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-logs
          path: |
            prepare-runtime*.log
            prepare-packages.log
            prepare-dsh.log
            apps/desktop/pe-list.txt
          if-no-files-found: ignore
          retention-days: 7
