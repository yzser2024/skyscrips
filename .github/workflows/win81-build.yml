name: Build app.asar only (win81 port)

# Produces ONLY app.asar for the existing Win7-patched Electron 44.2.0 runtime.
#
# The upstream `package:desktop:win:x64:unsigned` pipeline downloads Electron
# 44.7.0 and bundles it into the installer, which is what makes the result
# unable to start on Windows 8.1. Here we run only the preparation half of
# that pipeline (the half that materialises the dsh/ closure), then hand-pack
# app.asar ourselves and drop the bundled Electron entirely.
#
# Preparation order mirrors apps/desktop/scripts/package-target.ts (lines
# 518-561) exactly:
#   pack()            -> packed/dsh, packed/vendor, packed/landlock
#   prepare:runtime   -> electron host + primary runtime
#   prepare:packages  -> reads packed/*, emits package-set/
#   prepare:dsh       -> materialises targets/win-x64/dsh/
#
# app.asar layout mirrors electron-builder-config.mjs `files`:
#   lib/main.js, lib/welcome/**, lib/preload-*.cjs, renderer/**, package.json
#   dsh/**                 <- the prepared closure
#   dsh/node_modules/**    <- its node_modules

on:
  workflow_dispatch:

jobs:
  build-asar:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      DSH_DESKTOP_TARGET_PLATFORM: win32
      DSH_DESKTOP_TARGET_ARCH: x64
      # The build orchestrator reads the non-public SELECTOR DSH_BUILD_CLIENT_PROFILE
      # (scripts/build.ts:181: profile ?? process.env[CLIENT_BUILD_PROFILE_SELECTOR]).
      # Selecting "local" makes resolveClientBuildEnvironment emit exactly
      #   { DSH_CLIENT_BUILD_PROFILE: 'local', DSH_CLIENT_COMMIT_HASH, DSH_CLIENT_VERSION }
      # which is what pack-local-packages.ts asserts against. Do NOT set
      # DSH_CLIENT_BUILD_PROFILE / DSH_CLIENT_TITLE here: the assertion compares the
      # exact key set, and "official" belongs only to signed release builds.
      DSH_BUILD_CLIENT_PROFILE: local
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: dshu-win81-build
          fetch-depth: 1

      - name: Ensure git commit for build version
        shell: bash
        run: |
          git config user.email build@local
          git config user.name Build
          if [ -z "$(git rev-parse HEAD 2>/dev/null)" ]; then
            git add -A
            git commit -m "baseline"
          fi
          git rev-parse HEAD

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Setup pnpm 11.28.5 via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Generate and verify tsconfig paths
        shell: bash
        run: |
          pnpm run gen-tsconfig-paths
          pnpm run verify-tsconfig-paths

      - name: Build
        shell: bash
        run: pnpm run build

      - name: Create .env.windows
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.dsh.uncensored
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://policy.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={}
          EOF
          cat apps/desktop/.env.windows

      # pack() from package-target.ts: local tarballs for dsh, vendor, landlock.
      - name: Pack local packages (dsh / vendor / landlock)
        shell: bash
        run: |
          set -o pipefail
          PACKED=apps/desktop/.desktop-build/targets/win-x64/packed
          mkdir -p "$PACKED/dsh" "$PACKED/vendor" "$PACKED/landlock"

          echo "--- pack-local-packages -> packed/dsh"
          pnpm exec tsx apps/desktop/scripts/pack-local-packages.ts --out "$PACKED/dsh" 2>&1 | tail -20

          echo "--- desktop-host pack -> packed/dsh"
          pnpm --dir apps/desktop-host pack --pack-destination "$PACKED/dsh" 2>&1 | tail -5

          echo "--- release:pack vendor -> packed/vendor"
          pnpm run release:pack --family vendor --out "$PACKED/vendor" 2>&1 | tail -10 || \
            echo "WARN: release:pack vendor failed (may be unnecessary)"

          echo "--- native/system build:ts + pack -> packed/landlock"
          pnpm --dir native/system run build:ts
          echo "build:ts exit=$?"
          ls -la native/system/packages/entry/lib 2>/dev/null | head -10 || echo "entry/lib missing"
          pnpm --dir native/system/packages/entry pack --pack-destination "$PACKED/landlock"
          echo "entry pack exit=$?"
          ls -la "$PACKED/landlock"

          echo "=== packed contents ==="
          for d in dsh vendor landlock; do
            echo "  [$d] $(ls -1 "$PACKED/$d" 2>/dev/null | wc -l) files"
          done

      # prepare:runtime downloads the Electron host used to run pnpm install.
      - name: Prepare runtime (electron host + primary runtime)
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx apps/desktop/scripts/prepare-runtime.ts --defer-primary-runtime-smoke 2>&1 | tee prepare-runtime.log

      # prepare:packages consumes packed/* and emits the package set.
      #
      # packed/landlock holds @deepseek-ai/node-addon-system (the Linux Landlock
      # launcher). Its optionalDependencies list only darwin/linux variants, so on
      # win32 pnpm packs nothing into that directory and prepare:packages would
      # abort on the empty input ("contains no tarballs"). selectDesktopPackageClosure
      # only recurses into optional deps that are actually present (line 94), so
      # omitting the landlock input is safe for a Windows payload. Prefer it when
      # the directory is empty and fall back to the default inputs otherwise.
      - name: Prepare package set
        shell: bash
        run: |
          set -o pipefail
          PACKED_DIR=apps/desktop/.desktop-build/targets/win-x64/packed
          LANDLOCK_COUNT=$(ls -1 "$PACKED_DIR/landlock" 2>/dev/null | wc -l)
          echo "packed/landlock entries: $LANDLOCK_COUNT"
          if [ "$LANDLOCK_COUNT" -gt 0 ]; then
            pnpm exec tsx apps/desktop/scripts/prepare-package-set.ts 2>&1 | tee prepare-packages.log
          else
            echo "landlock has no tarballs (expected on win32); passing explicit --from"
            pnpm exec tsx apps/desktop/scripts/prepare-package-set.ts \
              --from "$PACKED_DIR/dsh" \
              --from "$PACKED_DIR/vendor" 2>&1 | tee prepare-packages.log
          fi

      # prepare:dsh materialises targets/win-x64/dsh/ (this is the asar payload).
      - name: Prepare dsh closure
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx apps/desktop/scripts/prepare-dsh.ts --defer-runtime-smoke 2>&1 | tee prepare-dsh.log

      - name: Inspect prepared tree
        shell: bash
        run: |
          echo "=== targets/win-x64 ==="
          ls -la apps/desktop/.desktop-build/targets/win-x64/ || true
          echo "=== dsh/ ==="
          ls -la apps/desktop/.desktop-build/targets/win-x64/dsh/ || true
          du -sh apps/desktop/.desktop-build/targets/win-x64/dsh/ 2>/dev/null || true

      - name: Assemble asar root
        shell: bash
        run: |
          set -e
          cd apps/desktop
          DSH_DIR=".desktop-build/targets/win-x64/dsh"
          if [ ! -f "$DSH_DIR/package.json" ]; then
            echo "::error::no prepared dsh/package.json at $DSH_DIR"
            find .desktop-build -maxdepth 6 -type d 2>/dev/null | head -80
            exit 1
          fi
          du -sh "$DSH_DIR"

          ROOT="$PWD/.asar-root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/dsh"

          cp -r lib "$ROOT/lib"
          cp -r renderer "$ROOT/renderer"
          cp package.json "$ROOT/package.json"

          (cd "$DSH_DIR" && tar cf - .) | (cd "$ROOT/dsh" && tar xf -)

          find "$ROOT" -type f \( -name '*.js.map' -o -name '*.cjs.map' -o -name '*.mjs.map' -o -name '*.tsbuildinfo' \) -delete || true

          echo "=== layout ==="
          ls -la "$ROOT"
          du -sh "$ROOT"

      - name: Merge extraMetadata into package.json
        shell: bash
        run: |
          set -e
          cd apps/desktop
          node -e '
            const fs = require("node:fs");
            const p = ".asar-root/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.name = "deepseek-harness-uncensored";
            j.dshDesktopAppId = "com.deepseek.dsh.uncensored";
            try { j.dshUncensored = JSON.parse(fs.readFileSync("../../product.json", "utf8")); }
            catch (e) { console.log("product.json skipped:", e.message); }
            fs.writeFileSync(p, JSON.stringify(j, undefined, 2));
            console.log("package.json name=" + j.name + " version=" + j.version);
          '

      - name: Pack app.asar
        shell: bash
        run: |
          set -e
          cd apps/desktop
          npx --yes @electron/asar pack .asar-root app.asar
          wc -c < app.asar
          echo "=== dsh entries in asar ==="
          npx --yes @electron/asar list app.asar | grep -c '^/dsh' || true
          echo "=== top entries ==="
          npx --yes @electron/asar list app.asar | awk -F/ 'NF==2' | head -20

      - name: Upload app.asar
        uses: actions/upload-artifact@v4
        with:
          name: dshu-app-asar
          path: apps/desktop/app.asar
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-logs
          path: |
            prepare-runtime.log
            prepare-packages.log
            prepare-dsh.log
          if-no-files-found: ignore
          retention-days: 7
