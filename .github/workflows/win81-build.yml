name: Build app.asar only (win81 port)

# Produces ONLY app.asar for the existing Win7-patched Electron 44.2.0 runtime.
#
# The upstream pipeline downloads Electron 44.7.0 and uses it two ways:
#   1. as the Node host that runs `pnpm install --prod` for the dsh/ closure
#   2. as the runtime that gets bundled into the installer
# Only (1) matters here. Step (2) is what makes the resulting app unable to
# start on Windows 8.1. So we let the upstream pipeline prepare the dsh/ tree,
# then hand-pack app.asar ourselves and drop the bundled Electron entirely.
#
# The target machine supplies Electron 44.2.0 (Win7-patched) plus the matching
# app.asar.unpacked native modules; every native module version in this tree
# matches that runtime exactly.

on:
  workflow_dispatch:

jobs:
  build-asar:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: dshu-win81-build
          fetch-depth: 1

      - name: Ensure git commit for build version
        shell: bash
        run: |
          git config user.email build@local
          git config user.name Build
          if [ -z "$(git rev-parse HEAD 2>/dev/null)" ]; then
            git add -A
            git commit -m "baseline"
          fi
          git rev-parse HEAD

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Setup pnpm 11.28.5 via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Generate and verify tsconfig paths
        shell: bash
        run: |
          pnpm run gen-tsconfig-paths
          pnpm run verify-tsconfig-paths

      - name: Build
        shell: bash
        run: pnpm run build

      - name: Create .env.windows
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.dsh.uncensored
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://policy.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={}
          EOF
          cat apps/desktop/.env.windows

      # prepare:runtime downloads Electron (needed as the Node host) and the
      # primary runtime. --defer-primary-runtime-smoke keeps the run shorter.
      - name: Prepare runtime (electron host + primary runtime)
        shell: bash
        run: |
          set -o pipefail
          export DSH_DESKTOP_TARGET_PLATFORM=win32
          export DSH_DESKTOP_TARGET_ARCH=x64
          cd apps/desktop
          # pnpm forwards extra args as positional args; call tsx directly instead.
          pnpm exec tsx scripts/prepare-runtime.ts --defer-primary-runtime-smoke 2>&1 | tee prepare-runtime.log

      - name: Prepare package set
        shell: bash
        run: |
          set -o pipefail
          export DSH_DESKTOP_TARGET_PLATFORM=win32
          export DSH_DESKTOP_TARGET_ARCH=x64
          cd apps/desktop
          pnpm run prepare:packages 2>&1 | tee prepare-packages.log

      # This is the step that materialises .desktop-build/targets/win-x64/dsh/.
      - name: Prepare dsh closure
        shell: bash
        run: |
          set -o pipefail
          export DSH_DESKTOP_TARGET_PLATFORM=win32
          export DSH_DESKTOP_TARGET_ARCH=x64
          cd apps/desktop
          pnpm exec tsx scripts/prepare-dsh.ts --defer-runtime-smoke 2>&1 | tee prepare-dsh.log

      - name: Inspect prepared tree
        shell: bash
        run: |
          cd apps/desktop
          echo "=== targets/win-x64 top level ==="
          ls -la .desktop-build/targets/win-x64/ || true
          echo "=== dsh/ ==="
          ls -la .desktop-build/targets/win-x64/dsh/ || true
          du -sh .desktop-build/targets/win-x64/dsh/ 2>/dev/null || true

      - name: Assemble asar root
        shell: bash
        run: |
          set -e
          cd apps/desktop
          DSH_DIR=".desktop-build/targets/win-x64/dsh"
          if [ ! -f "$DSH_DIR/package.json" ]; then
            echo "::error::no prepared dsh/package.json at $DSH_DIR"
            find .desktop-build -maxdepth 6 -type d 2>/dev/null | head -80
            exit 1
          fi
          echo "DSH_DIR=$DSH_DIR"
          du -sh "$DSH_DIR"

          ROOT="$PWD/.asar-root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/dsh"

          # Desktop shell entries (mirrors electron-builder `files`)
          cp -r lib "$ROOT/lib"
          cp -r renderer "$ROOT/renderer"
          cp package.json "$ROOT/package.json"

          # Prepared dsh closure, including its node_modules
          (cd "$DSH_DIR" && tar cf - .) | (cd "$ROOT/dsh" && tar xf -)

          # electron-builder strips these; match that
          find "$ROOT" -type f \( -name '*.js.map' -o -name '*.cjs.map' -o -name '*.mjs.map' -o -name '*.tsbuildinfo' \) -delete || true

          echo "=== layout ==="
          ls -la "$ROOT"
          du -sh "$ROOT"

      - name: Merge electron extraMetadata into package.json
        shell: bash
        run: |
          set -e
          cd apps/desktop
          node -e '
            const fs = require("node:fs");
            const p = ".asar-root/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.name = "deepseek-harness-uncensored";
            j.dshDesktopAppId = "com.deepseek.dsh.uncensored";
            try {
              j.dshUncensored = JSON.parse(fs.readFileSync("../../product.json", "utf8"));
            } catch (e) { console.log("product.json not merged:", e.message); }
            fs.writeFileSync(p, JSON.stringify(j, undefined, 2));
            console.log("package.json name=" + j.name + " version=" + j.version);
          '

      - name: Pack app.asar
        shell: bash
        run: |
          set -e
          cd apps/desktop
          npx --yes @electron/asar pack .asar-root app.asar
          wc -c < app.asar
          echo "=== listing head ==="
          npx --yes @electron/asar list app.asar | head -30
          echo "=== dsh/ present? ==="
          npx --yes @electron/asar list app.asar | grep -c '^/dsh' || true

      - name: Upload app.asar
        uses: actions/upload-artifact@v4
        with:
          name: dshu-app-asar
          path: apps/desktop/app.asar
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-logs
          path: |
            apps/desktop/prepare-runtime.log
            apps/desktop/prepare-packages.log
            apps/desktop/prepare-dsh.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump tree on failure
        if: failure()
        shell: bash
        run: |
          echo "=== .desktop-build dirs ==="
          find apps/desktop/.desktop-build -maxdepth 7 -type d 2>/dev/null | head -120 || true
