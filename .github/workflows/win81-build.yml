name: Build Windows x64 (win81 source)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: dshu-win81-build
          fetch-depth: 1

      - name: Ensure git commit for build version
        shell: bash
        run: |
          git config user.email build@local
          git config user.name Build
          if [ -z "$(git rev-parse HEAD 2>/dev/null)" ]; then
            git add -A
            git commit -m "baseline"
          fi
          git rev-parse HEAD

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Verify Node version
        shell: bash
        run: node --version

      - name: Setup pnpm 11.28.5 via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Generate and verify tsconfig paths
        shell: bash
        run: |
          pnpm run gen-tsconfig-paths
          pnpm run verify-tsconfig-paths

      - name: Build
        shell: bash
        run: pnpm run build

      - name: Create .env.windows for unsigned local package
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.dsh.uncensored
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=
          DOWNLOAD_TEST_RELEASE_ID=eab06ff94045799c8db394b1cbd5bb06
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://test.example.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://update.example.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.example.com"]}
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3
          EOF
          echo "=== .env.windows created ==="
          cat apps/desktop/.env.windows

      - name: Package Windows x64 (unsigned)
        shell: bash
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Locate artifacts
        if: always()
        shell: bash
        run: |
          echo "=== .desktop-build tree ==="
          find apps/desktop/.desktop-build -maxdepth 5 -type f 2>/dev/null | head -120 || true
          echo "=== candidate exe/msi/zip ==="
          find apps/desktop/.desktop-build -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.zip' -o -iname '*.blockmap' \) 2>/dev/null | head -120 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win81-desktop-x64-unsigned
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**/*.blockmap
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**/*.zip
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**/*.7z
          if-no-files-found: warn
          retention-days: 7
