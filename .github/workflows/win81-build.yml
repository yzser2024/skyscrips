name: Build app.asar only (win81 port)

# Produces app.asar (+ app.asar.unpacked) for the Win7-patched Electron 44.2.0
# already installed on the target machine. The upstream `package:desktop:*`
# pipeline downloads Electron 44.7.0 and bundles it, which is what makes its
# output unable to start on Windows 8.1. Here we run only the preparation half
# of that pipeline, then hand-pack the asar.
#
# Verified against a working local install (E:\tool\dsh 0.2.2-rc.3):
#   app.asar           200.0 MB  -> dsh 184.7MB(18939f,+1671 unpacked),
#                                   node_modules 8.1MB, lib 1.7MB, renderer, package.json
#   app.asar.unpacked  254.1 MB  1671 files, top level is exactly `dsh/`
#   runtime            487.7 MB  extraResources, NOT part of the asar
#
# asar layout mirrors electron-builder-config.mjs files[] (157-173):
#   lib/main.js, lib/operation-report-worker.js, lib/welcome/**,
#   lib/preload-*.cjs, renderer/**, package.json,
#   dsh/**, dsh/node_modules/**, node_modules/**
# and asarUnpack (82-87) is applied through --unpack.

on:
  workflow_dispatch:

jobs:
  build-asar:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      DSH_DESKTOP_TARGET_PLATFORM: win32
      DSH_DESKTOP_TARGET_ARCH: x64
      # Selector, not the recorded value: scripts/build.ts:181 reads
      # DSH_BUILD_CLIENT_PROFILE, and 'local' makes the build record contain
      # exactly { DSH_CLIENT_BUILD_PROFILE: 'local', COMMIT_HASH, VERSION },
      # which pack-local-packages.ts asserts against. Do not add DSH_CLIENT_TITLE.
      DSH_BUILD_CLIENT_PROFILE: local
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: dshu-win81-build
          fetch-depth: 1

      - name: Ensure git commit for build version
        shell: bash
        run: |
          git config user.email build@local
          git config user.name Build
          if [ -z "$(git rev-parse HEAD 2>/dev/null)" ]; then
            git add -A
            git commit -m "baseline"
          fi
          git rev-parse HEAD

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Setup pnpm 11.28.5 via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Generate and verify tsconfig paths
        shell: bash
        run: |
          pnpm run gen-tsconfig-paths
          pnpm run verify-tsconfig-paths

      - name: Build
        shell: bash
        run: pnpm run build

      # ASCII-only, no heredoc indentation: desktop-file-settings.mjs parses the
      # file verbatim and rejects keys outside the shared allowlist.
      - name: Create .env.windows
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'DSH_DESKTOP_APP_ID=com.deepseek.dsh.uncensored' \
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://policy.invalid' \
            'DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={}' \
            > apps/desktop/.env.windows
          if LC_ALL=C grep -qP '[^\x20-\x7e]' apps/desktop/.env.windows; then
            echo "::error::non-ASCII byte in .env.windows"; exit 1
          fi
          cat apps/desktop/.env.windows

      # pack() from package-target.ts. pnpm resolves --pack-destination relative
      # to the package directory, so every destination must be absolute.
      - name: Pack local packages (dsh / vendor / landlock)
        shell: bash
        run: |
          set -euo pipefail
          PACKED="apps/desktop/.desktop-build/targets/win-x64/packed"
          ABS_DSH="$PWD/$PACKED/dsh"
          ABS_VENDOR="$PWD/$PACKED/vendor"
          ABS_LANDLOCK="$PWD/$PACKED/landlock"
          mkdir -p "$ABS_DSH" "$ABS_VENDOR" "$ABS_LANDLOCK"

          pnpm exec tsx apps/desktop/scripts/pack-local-packages.ts --out "$ABS_DSH"
          pnpm --dir apps/desktop-host pack --pack-destination "$ABS_DSH"
          pnpm run release:pack --family vendor --out "$ABS_VENDOR"
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$ABS_LANDLOCK"

          echo "=== packed contents ==="
          for d in dsh vendor landlock; do echo "  [$d] $(ls -1 "$PACKED/$d" | wc -l) files"; done
          ls -1 "$ABS_DSH" | grep -i 'dsh-desktop-host' || { echo "::error::desktop-host tarball missing"; exit 1; }
          ls -1 "$ABS_LANDLOCK" | grep -i 'node-addon-system' || { echo "::error::node-addon-system tarball missing"; exit 1; }

      # prepare.ts uses bare Node fetch (no proxy support) and pulls
      # python-build-standalone from a GitHub Release, so retry transient failures.
      - name: Prepare runtime (electron host + primary runtime)
        shell: bash
        run: |
          set -uo pipefail
          export DSH_RESOURCE_DOWNLOAD_TIMEOUT_MS=600000
          for attempt in 1 2 3; do
            LOG="prepare-runtime-$attempt.log"
            echo "=== prepare:runtime attempt $attempt ==="
            if pnpm exec tsx apps/desktop/scripts/prepare-runtime.ts --defer-primary-runtime-smoke >"$LOG" 2>&1; then
              cp "$LOG" prepare-runtime.log
              tail -30 "$LOG"
              exit 0
            fi
            echo "=== attempt $attempt FAILED — full log ==="
            cat "$LOG"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::prepare:runtime failed after 3 attempts"
          exit 1

      # All three packed dirs are required inputs: @deepseek-ai/dsh-sandbox-local
      # declares @deepseek-ai/node-addon-system in `dependencies` (not optional),
      # and prepare-package-set.ts:88 throws "requires unpacked package" when a
      # workspace dep is absent from the inputs.
      - name: Prepare package set
        shell: bash
        run: |
          set -euo pipefail
          PACKED_DIR="$PWD/apps/desktop/.desktop-build/targets/win-x64/packed"
          pnpm exec tsx apps/desktop/scripts/prepare-package-set.ts \
            --from "$PACKED_DIR/dsh" \
            --from "$PACKED_DIR/vendor" \
            --from "$PACKED_DIR/landlock" 2>&1 | tee prepare-packages.log
          cat prepare-packages.log

      - name: Prepare dsh closure
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx apps/desktop/scripts/prepare-dsh.ts --defer-runtime-smoke 2>&1 | tee prepare-dsh.log

      - name: Inspect prepared tree
        shell: bash
        run: |
          D="apps/desktop/.desktop-build/targets/win-x64/dsh"
          ls -la "$D" || true
          du -sh "$D" || true
          echo "=== dsh top-level entries ==="
          ls -1A "$D"

      # Mirrors electron-builder-config.mjs files[] (157-173). Note the top-level
      # node_modules entry: the real app.asar carries one (8.1 MB, 1129 files).
      - name: Assemble asar root
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          DSH_DIR=".desktop-build/targets/win-x64/dsh"
          test -f "$DSH_DIR/package.json" || { echo "::error::dsh/package.json missing"; exit 1; }
          test -f lib/welcome/design-platform.css || { echo "::error::lib/welcome/design-platform.css missing"; exit 1; }
          test -d node_modules || { echo "::error::apps/desktop/node_modules missing"; exit 1; }

          ROOT="$PWD/.asar-root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/lib/welcome" "$ROOT/dsh"

          cp lib/main.js lib/operation-report-worker.js "$ROOT/lib/"
          cp lib/preload-app.cjs lib/preload-mandatory.cjs lib/preload-platform-account.cjs \
             lib/preload-update-dialog.cjs lib/preload-welcome.cjs "$ROOT/lib/"
          cp -r lib/welcome/. "$ROOT/lib/welcome/"
          cp -r renderer "$ROOT/renderer"
          cp package.json "$ROOT/package.json"

          # prepare-dsh.ts already materialised dsh/ with dereference:true
          # (prepare-dsh.ts:137-140), so this tree holds real files, not pnpm
          # symlinks. Verify that before copying, since a link farm would make
          # the asar silently incomplete.
          LINK_COUNT=$(find "$DSH_DIR" -type l 2>/dev/null | wc -l)
          echo "symlinks under dsh/: $LINK_COUNT"
          if [ "$LINK_COUNT" -gt 0 ]; then
            echo "::error::dsh/ contains $LINK_COUNT symlinks; expected a materialised tree"
            find "$DSH_DIR" -type l 2>/dev/null | head -10
            exit 1
          fi
          (cd "$DSH_DIR" && tar cf - .) | (cd "$ROOT/dsh" && tar xf -)

          # Top-level node_modules: the desktop app's own production deps
          # (electron-updater etc). A real package ships one (8.1 MB / 1129 files).
          # apps/desktop/node_modules is a pnpm link farm, so a plain `tar` copy
          # breaks every symlink (they point ../../node_modules/.pnpm/...).
          # Dereference into real files instead, and skip build-only packages.
          if [ -d node_modules ]; then
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const src = "node_modules";
              const dst = ".asar-root/node_modules";
              const skip = new Set(["electron","electron-builder","app-builder-lib","builder-util",
                "builder-util-runtime","electron-winstaller","@electron","electron-publish",
                "@electron/notarize","@electron/universal","@electron/asar","node-gyp","pnpm",
                "react","react-dom","vite","typescript","@types"]);
              fs.mkdirSync(dst, { recursive: true });
              let copied = 0;
              for (const name of fs.readdirSync(src)) {
                const base = name.startsWith("@") ? null : name;
                if (base && skip.has(base)) continue;
                const from = path.join(src, name);
                if (name.startsWith("@")) {
                  fs.mkdirSync(path.join(dst, name), { recursive: true });
                  for (const sub of fs.readdirSync(from)) {
                    if (skip.has(name + "/" + sub)) continue;
                    fs.cpSync(path.join(from, sub), path.join(dst, name, sub), { recursive: true, dereference: true });
                    copied++;
                  }
                } else {
                  fs.cpSync(from, path.join(dst, name), { recursive: true, dereference: true });
                  copied++;
                }
              }
              console.log("top-level node_modules packages copied:", copied);
            '
          fi

          find "$ROOT/dsh" -type f \( -name '*.js.map' -o -name '*.cjs.map' -o -name '*.mjs.map' -o -name '*.tsbuildinfo' \) -delete || true

          echo "=== layout ==="
          ls -1A "$ROOT"
          du -sh "$ROOT" "$ROOT/dsh" "$ROOT/node_modules" 2>/dev/null || true

          # Guard rails: dsh/ may only hold node_modules + package.json + descriptor
          UNEXPECTED=$(cd "$ROOT/dsh" && ls -1A | grep -vxE 'node_modules|package\.json|desktop-runtime\.json' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::unexpected entries in dsh/: $UNEXPECTED"
            exit 1
          fi
          test -d "$ROOT/dsh/node_modules" || { echo "::error::dsh/node_modules missing"; exit 1; }
          SZ=$(du -sm "$ROOT" | cut -f1)
          echo ".asar-root = ${SZ}MB"
          if [ "$SZ" -gt 900 ]; then
            echo "::error::.asar-root is ${SZ}MB, expected <900MB (runtime/ must not be inside)"
            exit 1
          fi

      # Mirrors electron-builder-config.mjs extraMetadata (123-132).
      - name: Merge extraMetadata into package.json
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          node -e '
            const fs = require("node:fs");
            const p = ".asar-root/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const base = j.version;
            const m = /^(\d{4})\.(\d{4})\.(\d+)$/.exec(base);
            const display = m ? `${m[1]}.${m[2].slice(0,2)}.${m[2].slice(2)}.${m[3]}` : base;
            Object.assign(j, {
              name: "deepseek-harness-uncensored",
              dshDesktopAppId: "com.deepseek.dsh.uncensored",
              dshUncensored: JSON.parse(fs.readFileSync("../../product.json", "utf8")),
              dshDisplayVersion: display,
              dshDesktopUpdateChannel: "latest",
            });
            if (m) j.shortVersionWindows = display;
            fs.writeFileSync(p, JSON.stringify(j, undefined, 2));
            console.log("metadata:", j.name, j.version, "| display:", j.dshDisplayVersion, "| channel:", j.dshDesktopUpdateChannel);
          '

      # PE detection by file header, not extension: windows-runtime-signature.mjs
      # (81-100) sniffs MZ + PE\0\0 and treats .exe/.dll/.pyd as required-to-be-PE.
      # Files matching that must live outside the asar (windows-asar-unpack.mjs:61).
      - name: Compute PE unpack list (header sniffing)
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          DSH_DIR=".desktop-build/targets/win-x64/dsh"
          node --input-type=module -e '
            import { readdir, open } from "node:fs/promises"
            import { join, relative } from "node:path"
            import { writeFileSync } from "node:fs"
            const root = process.argv[1]
            const out = []
            async function walk(dir) {
              for (const e of await readdir(dir, { withFileTypes: true })) {
                const p = join(dir, e.name)
                if (e.isDirectory()) { await walk(p); continue }
                if (!e.isFile()) continue
                const fh = await open(p, "r")
                let pe = false
                try {
                  const h = Buffer.alloc(64)
                  const { bytesRead } = await fh.read(h, 0, 64, 0)
                  if (bytesRead === 64 && h.readUInt16LE(0) === 0x5a4d) {
                    const off = h.readUInt32LE(0x3c)
                    if (off >= 64) {
                      const sig = Buffer.alloc(4)
                      const r = await fh.read(sig, 0, 4, off)
                      pe = r.bytesRead === 4 && sig.readUInt32LE(0) === 0x4550
                    }
                  }
                } finally { await fh.close() }
                if (pe) out.push(relative(root, p).split("\\").join("/"))
              }
            }
            await walk(root)
            out.sort()
            writeFileSync("pe-list.txt", out.join("\n") + "\n")
            console.log("PE files detected:", out.length)
          ' "$DSH_DIR"
          echo "=== first 30 ==="
          head -30 pe-list.txt
          echo "=== stale check: every entry must exist ==="
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            test -f "$DSH_DIR/$f" || { echo "::error::stale unpack entry: $f"; exit 1; }
          done < pe-list.txt

      # @electron/asar is only a TRANSITIVE dep (pnpm-lock.yaml:28374/30711/31634),
      # so pnpm does not hoist it and require.resolve from apps/desktop fails.
      # Install the lockfile's exact version as a direct devDependency first.
      - name: Ensure asar CLI available
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          VERSION=$(node -e '
            const fs=require("node:fs");
            const y=fs.readFileSync("../../pnpm-lock.yaml","utf8");
            const m=/[\x27"]?@electron\/asar@([0-9][^:\x27"]*)/.exec(y);
            process.stdout.write(m ? m[1] : "3.4.1");
          ')
          echo "asar version from lockfile: $VERSION"
          pnpm add -D "@electron/asar@$VERSION" --ignore-workspace-root-check
          node -e "console.log('resolved:', require.resolve('@electron/asar/bin/asar.js'))"

      - name: Pack app.asar with unpacked PE
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          ASAR_BIN=$(node -e "console.log(require.resolve('@electron/asar/bin/asar.js'))")
          echo "asar bin: $ASAR_BIN"
          test -f "$ASAR_BIN" || { echo "::error::asar bin not resolved"; exit 1; }

          ARGS=()
          while IFS= read -r f; do
            [ -n "$f" ] && ARGS+=("--unpack" "dsh/$f")
          done < pe-list.txt
          echo "unpack entries: ${#ARGS[@]}"

          node "$ASAR_BIN" pack .asar-root app.asar "${ARGS[@]}"
          ls -la app.asar
          wc -c < app.asar
          test -d app.asar.unpacked || { echo "::error::app.asar.unpacked not produced"; exit 1; }
          echo "=== unpacked file count ==="
          find app.asar.unpacked -type f | wc -l
          echo "=== unpacked top level ==="
          ls -1A app.asar.unpacked
          echo "=== asar top entries ==="
          node "$ASAR_BIN" list app.asar | awk -F/ 'NF==2' | head -20

      # Upload as a single tar.gz: upload-artifact drops empty directories, and
      # the unpacked LibreOffice payload relies on its directory structure.
      - name: Archive asar payload
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          tar -czf "$GITHUB_WORKSPACE/app-asar.tar.gz" app.asar app.asar.unpacked
          ls -la "$GITHUB_WORKSPACE/app-asar.tar.gz"
          sha256sum "$GITHUB_WORKSPACE/app-asar.tar.gz"

      - name: Upload asar
        uses: actions/upload-artifact@v4
        with:
          name: dshu-app-asar
          path: app-asar.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-logs
          path: |
            prepare-runtime*.log
            prepare-packages.log
            prepare-dsh.log
            apps/desktop/pe-list.txt
          if-no-files-found: ignore
          retention-days: 7
