name: probe-jp14

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取
        run: python /home/runner/work/skyscrips/skyscrips/.github/scripts/probe_jp14.py 2>&1 | tee /tmp/jp14_log.txt

      - name: 打包
        if: always()
        run: |
          cp /tmp/jp14_log.txt out_jp14/log_main.txt 2>/dev/null || true
          zip -r -0 jp14_out.zip out_jp14 2>/dev/null || true
          ls -la jp14_out.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jp14-out
          path: jp14_out.zip
          if-no-files-found: warn
