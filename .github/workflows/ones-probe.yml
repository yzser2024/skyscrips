name: ones-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: CDX 探测
        run: python ones_probe.py 2>&1 | tee probe_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ones-probe
          path: |
            out/
            probe_log.txt
          retention-days: 14
