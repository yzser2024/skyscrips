name: WPD Android Build

on:
  workflow_dispatch:
    inputs:
      asset_tag:
        description: 'Release tag holding the patch zip'
        required: false
        default: 'wpd-patch-src'
      asset_name:
        description: 'Asset filename inside that release'
        required: false
        default: 'WPD_rearranged_port_src.zip'
      upstream_commit:
        description: 'Upstream warpedpd commit'
        required: false
        default: '0f255c2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download patch zip from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.asset_tag }}
          NAME: ${{ inputs.asset_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          AID=$(curl -sS --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print([a['id'] for a in d['assets'] if a['name']=='$NAME'][0])")
          echo "asset id=$AID"
          curl -sSL --fail --retry 5 --retry-delay 3 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o /tmp/wpd-patch.zip \
            "https://api.github.com/repos/$REPO/releases/assets/$AID"
          ls -lh /tmp/wpd-patch.zip

      - name: Clone upstream
        run: |
          git clone --quiet https://github.com/GabriWar/warpedpd.git /tmp/warpedpd
          cd /tmp/warpedpd
          git checkout -q "${{ inputs.upstream_commit }}" || echo "WARN: commit not found"
          echo "HEAD=$(git rev-parse --short HEAD)"

      - name: Apply patch
        shell: bash
        run: |
          mkdir -p /tmp/patch && unzip -q /tmp/wpd-patch.zip -d /tmp/patch
          SRC=$(find /tmp/patch -maxdepth 4 -type d -name warped-core-src | head -1)
          test -d "$SRC/core/src/main/java" || { echo "patch structure invalid"; exit 1; }
          cp -a "$SRC/core/src/main/." /tmp/warpedpd/core/src/main/
          find /tmp/warpedpd/core/src/main/java -name "*.java" | wc -l

      - name: Fix known compile issues
        shell: bash
        run: |
          python3 - <<'PY'
          import os, glob

          root = '/tmp/warpedpd/core/src/main/java/xyz/gabriwar/warpedpixeldungeon'
          os.chdir(root)

          # 1) drop duplicated (truncated) Icons class in ItemSpriteSheet
          p = 'sprites/ItemSpriteSheet.java'
          lines = open(p, encoding='utf-8').read().split('\n')
          idx = [i for i, l in enumerate(lines) if l.strip() == 'public static class Icons {']
          print('Icons definitions at lines:', [i + 1 for i in idx])
          if len(idx) >= 2:
              start = idx[-1]
              while start - 1 >= 0 and lines[start - 1].strip().startswith('//'):
                  start -= 1
              depth = 0
              end = None
              for i in range(start, len(lines)):
                  depth += lines[i].count('{') - lines[i].count('}')
                  if depth == 0 and i > start:
                      end = i
                      break
              if end is None:
                  raise SystemExit('cannot locate end of duplicated Icons class')
              del lines[start:end + 1]
              open(p, 'w', encoding='utf-8').write('\n'.join(lines))
              print('removed duplicated Icons lines %d..%d' % (start + 1, end + 1))
          print('remaining Icons:', sum(1 for l in lines if l.strip() == 'public static class Icons {'))

          # 2) add missing SpiritBow import to bow classes
          IMP = 'import xyz.gabriwar.warpedpixeldungeon.items.weapon.SpiritBow;'
          for f in sorted(glob.glob('items/weapon/bow/*.java')):
              s = open(f, encoding='utf-8').read()
              if IMP in s:
                  continue
              ls = s.split('\n')
              last = -1
              for i, l in enumerate(ls[:80]):
                  if l.startswith('import '):
                      last = i
              if last >= 0:
                  ls.insert(last + 1, IMP)
              open(f, 'w', encoding='utf-8').write('\n'.join(ls))
              print('import added:', f)

          # 3) drop import of non-existent HG_T1
          p = 'items/Generator.java'
          s = open(p, encoding='utf-8').read()
          bad = 'import xyz.gabriwar.warpedpixeldungeon.items.weapon.melee.gun.HG.HG_T1;\n'
          if bad in s:
              open(p, 'w', encoding='utf-8').write(s.replace(bad, ''))
              print('Generator: HG_T1 import removed')
          print('FIX DONE')
          PY

      - name: Setup Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          echo "sdk.dir=$ANDROID_HOME" > /tmp/warpedpd/local.properties

      - name: Build APK (github release, unsigned)
        run: |
          cd /tmp/warpedpd
          chmod +x gradlew
          ./gradlew :android:assembleGithubRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: '-Xmx4g -Dfile.encoding=UTF-8'

      - name: Locate APKs
        if: always()
        run: |
          find /tmp/warpedpd/android/build/outputs -name "*.apk" -printf "%10s  %p\n" 2>/dev/null | sort -rn | head

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpd-android-apk
          path: /tmp/warpedpd/android/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
