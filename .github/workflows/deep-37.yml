name: deep-37
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep37_mylink.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep31
          path: out_deep37
          if-no-files-found: warn
