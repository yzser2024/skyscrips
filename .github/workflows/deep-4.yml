name: deep-4

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 日记板滚动窗口全量
        run: python deep4_diary.py 2>&1 | tee deep_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-4
          path: |
            out_deep4/
            deep_log.txt
          retention-days: 20
