name: probe-jp24

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 下载 note-sound 全部 89 首
        run: python .github/scripts/probe_jp24.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp24-v1, path: out_jp24/snd_vol1.zip, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp24-v2, path: out_jp24/snd_vol2.zip, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp24-v3, path: out_jp24/snd_vol3.zip, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp24-v4, path: out_jp24/snd_vol4.zip, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp24-v5, path: out_jp24/snd_vol5.zip, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp24-v6, path: out_jp24/snd_vol6.zip, if-no-files-found: warn, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jp24-meta, path: out_jp24/snd_meta.zip, if-no-files-found: warn, compression-level: 0 }
