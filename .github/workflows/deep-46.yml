name: deep-46
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep46_soundcloud.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep46
          path: out_deep46
          if-no-files-found: warn
