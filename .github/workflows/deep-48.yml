name: deep-48
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep48_oneyunn.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep48
          path: out_deep48
          if-no-files-found: warn
