name: deep-38
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep38_withr17about.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep38
          path: out_deep38
          if-no-files-found: warn
