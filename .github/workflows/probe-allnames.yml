name: probe-allnames

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取
        run: python /home/runner/work/skyscrips/skyscrips/.github/scripts/probe_allnames.py 2>&1 | tee /tmp/an_log.txt

      - name: 打包
        if: always()
        run: |
          cp /tmp/an_log.txt out_an/log_main.txt 2>/dev/null || true
          zip -r -0 an_out.zip out_an 2>/dev/null || true
          ls -la an_out.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an-out
          path: an_out.zip
          if-no-files-found: warn
