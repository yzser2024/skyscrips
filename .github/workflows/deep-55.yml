name: deep-55
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep55_forgery.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep55
          path: out_deep55
          if-no-files-found: warn
