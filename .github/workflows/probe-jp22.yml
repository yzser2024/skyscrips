name: probe-jp22

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取
        run: python /home/runner/work/skyscrips/skyscrips/.github/scripts/probe_jp22.py 2>&1 | tee /tmp/jp22_log.txt

      - name: 打包
        if: always()
        run: |
          cp /tmp/jp22_log.txt out_jp22/log_main.txt 2>/dev/null || true
          zip -r -0 jp22_out.zip out_jp22 2>/dev/null || true
          ls -la jp22_out.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jp22-out
          path: jp22_out.zip
          if-no-files-found: warn
