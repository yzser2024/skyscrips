name: deep-75
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 .github/scripts/deep75_w79full.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep75
          path: out_deep75
          if-no-files-found: warn
