name: deep-41
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep41_twitter.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep41
          path: out_deep41
          if-no-files-found: warn
