name: tl-fetch

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取
        run: python /home/runner/work/skyscrips/skyscrips/.github/scripts/tl_fetch.py 2>&1 | tee /tmp/tl_log.txt

      - name: 打包
        if: always()
        run: |
          cp /tmp/tl_log.txt out_tl/log_main.txt 2>/dev/null || true
          zip -r -0 tl_out.zip out_tl 2>/dev/null || true
          ls -la tl_out.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tl-out
          path: tl_out.zip
          if-no-files-found: warn
