name: deep-25
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: python3 deep25_rocketbbs.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep25
          path: out_deep25
          if-no-files-found: warn
