name: deep-76
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 .github/scripts/deep76_kagemp3.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep76
          path: out_deep76
          if-no-files-found: warn
