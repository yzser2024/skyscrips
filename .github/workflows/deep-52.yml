name: deep-52
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep52_lyrics.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep52
          path: out_deep52
          if-no-files-found: warn
