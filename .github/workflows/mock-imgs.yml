name: mock-imgs
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python mock_imgs.py 2>&1 | tee mock_imgs_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-imgs
          path: |
            imgs/
            imgs_report.json
            mock_imgs_log.txt
