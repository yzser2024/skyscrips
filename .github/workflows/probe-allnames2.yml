name: probe-allnames2

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取
        run: python /home/runner/work/skyscrips/skyscrips/.github/scripts/probe_allnames2.py 2>&1 | tee /tmp/a2_log.txt

      - name: 打包
        if: always()
        run: |
          cp /tmp/a2_log.txt out_a2/log_main.txt 2>/dev/null || true
          zip -r -0 a2_out.zip out_a2 2>/dev/null || true
          ls -la a2_out.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-out
          path: a2_out.zip
          if-no-files-found: warn
