name: deep-50
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep50_scdesc.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep50
          path: out_deep50
          if-no-files-found: warn
