name: deep-42
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep42_twilog.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep42
          path: out_deep42
          if-no-files-found: warn
