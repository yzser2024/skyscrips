name: tumblr-deep

# 用无头 Chromium 抓 ucaliy.tumblr.com 全部帖子（绕过 Cloudflare JS 挑战 + 无限滚动）
# Actions → tumblr-deep → Run workflow → 下载 tumblr-deep

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 Playwright 与 Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 抓取
        run: |
          mkdir -p out
          python dump_tumblr.py 2>&1 | tee out/log.txt

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tumblr-deep
          path: out/
          retention-days: 14
          if-no-files-found: warn
