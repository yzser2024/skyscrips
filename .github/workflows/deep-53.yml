name: deep-53
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep53_lyrics2.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep53
          path: out_deep53
          if-no-files-found: warn
