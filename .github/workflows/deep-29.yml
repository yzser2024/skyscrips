name: deep-29
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep29_amorimg.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep28
          path: out_deep29
          if-no-files-found: warn
