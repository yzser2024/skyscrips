name: deep-39
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 deep39_unseen3.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep39
          path: out_deep39
          if-no-files-found: warn
