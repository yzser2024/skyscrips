name: ones-ui2

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 只补图片素材
        run: python ones_ui_fetch2.py 2>&1 | tee ui2_log.txt || true
      - name: 统计
        run: |
          find out_ui -type f | wc -l
          du -sh out_ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ones-ui2
          path: |
            out_ui/
            ui2_log.txt
          retention-days: 14
