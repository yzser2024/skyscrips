name: deep-78
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: grab
        run: python3 .github/scripts/deep78_audio2.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-deep78
          path: out_deep78
          if-no-files-found: warn
