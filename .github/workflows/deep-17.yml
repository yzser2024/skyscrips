name: deep-17

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 六个时间点导航页
        run: python deep17_nav.py 2>&1 | tee deep_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-17
          path: |
            out_deep17/
            deep_log.txt
          retention-days: 20
