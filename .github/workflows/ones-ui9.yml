name: ones-ui9

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 列全皮肤图并补抓
        run: python ones_ui_fetch9.py 2>&1 | tee ui9_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ones-ui9
          path: |
            out_ui/
            ui9_log.txt
          retention-days: 14
